<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_tesla" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0a0a"/>
      <stop offset="100%" stop-color="#2d1214"/>
    </linearGradient>
    <linearGradient id="carBody_tesla" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="40%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="glass_tesla" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0c4a6e" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#bg_tesla)"/>
  <ellipse cx="300" cy="275" rx="240" ry="25" fill="#ef4444" opacity="0.15"/>
  <ellipse cx="300" cy="285" rx="220" ry="12" fill="#000000" opacity="0.5"/>

  <rect x="430" y="24" width="146" height="32" rx="16" fill="#2d1214" stroke="#4c1d1f" stroke-width="1"/>
  <text x="503" y="45" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f87171" text-anchor="middle">TESLA MODEL 3</text>

  <g>
    <!-- Tesla Aerodynamic Fastback Body -->
    <path d="M85 234 C90 210 110 200 138 200 L215 194 L290 112 C310 98 350 96 405 98 L470 112 C500 122 525 158 540 190 L552 216 C558 230 552 250 535 254 L98 254 C88 254 82 245 85 234 Z" fill="url(#carBody_tesla)"/>
    <path d="M285 116 L225 192 L485 192 L455 116 C430 104 315 102 285 116 Z" fill="url(#glass_tesla)"/>
    <path d="M360 112 L350 192 L375 192 L380 112 Z" fill="#18181b"/>

    <!-- Minimalist Tesla LED Headlight -->
    <path d="M522 198 L546 206 L530 214 Z" fill="#ffffff"/>
    <path d="M88 218 L112 220 L108 232 L90 230 Z" fill="#ef4444"/>

    <!-- Flush Door Handles -->
    <rect x="310" y="198" width="18" height="4" rx="2" fill="#7f1d1d"/>
    <rect x="390" y="198" width="18" height="4" rx="2" fill="#7f1d1d"/>

    <path d="M140 254 A45 45 0 0 1 230 254 Z" fill="#09090b"/>
    <path d="M415 254 A45 45 0 0 1 505 254 Z" fill="#09090b"/>
  </g>

  <!-- Left Aero Wheel -->
  <g transform="translate(185, 254)">
    <circle r="39" fill="#18181b"/>
    <circle r="27" fill="#27272a" stroke="#71717a" stroke-width="2"/>
    <circle r="12" fill="#09090b"/>
    <circle r="6" fill="#ef4444"/>
  </g>
  <!-- Right Aero Wheel -->
  <g transform="translate(460, 254)">
    <circle r="39" fill="#18181b"/>
    <circle r="27" fill="#27272a" stroke="#71717a" stroke-width="2"/>
    <circle r="12" fill="#09090b"/>
    <circle r="6" fill="#ef4444"/>
  </g>
</svg>
